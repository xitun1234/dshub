app = 'xskt-manager'
primary_region = 'nrt'

[deployment]
  strategy = "recreate"

[env]
  DATABASE_URL = 'file:/data/database.sqlite'

[[mounts]]
  source = 'data_volume'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb" # Hạ xuống 1GB để dễ lấy tài nguyên hơn
  cpus = 1